<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Indicator Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #111;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

.dashboard-container {
  max-width: 600px;
  margin: 0 auto;
}

.header-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #333;
  padding-bottom: 15px;
}

.header-title h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.5px;
}

.market-date-badge {
  background: #222;
  border: 1px solid #444;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  color: #aaa;
}

.market-date-badge span {
  color: #fff;
  font-weight: bold;
}

/* Indicator Grid / Card */
.card {
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #2a2a2a;
  margin-bottom: 20px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.card-title {
  font-size: 13px;
  font-weight: bold;
  color: #aaa;
  letter-spacing: 0.5px;
}

.zone-badge {
  padding: 5px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: bold;
  white-space: nowrap;
}

.bar {
  display: flex;
  height: 10px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 8px;
}

.green  { width: 30%; background: #22c55e; }
.yellow { width: 20%; background: #eab308; }
.orange { width: 20%; background: #f97316; }
.red    { width: 30%; background: #ef4444; }

input[type="range"] {
  width: 100%;
  accent-color: #ffffff;
  cursor: pointer;
  margin: 8px 0;
}

.ticks {
  display: flex;
  justify-content: space-between;
  color: #666;
  font-size: 10px;
  margin-bottom: 15px;
}

.card-result {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.current-value {
  font-size: 36px;
  font-weight: bold;
  line-height: 1;
}

.description {
  font-size: 12px;
  color: #ccc;
  text-align: right;
}
</style>
</head>

<body>

<div class="dashboard-container">
  
  <div class="header-title">
    <h2>MARKET INDICATORS</h2>
    <div class="market-date-badge">Updated: <span id="market-date">--</span></div>
  </div>

  <!-- RSI CARD -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">RSI (14)</span>
      <span id="rsi-zone" class="zone-badge">ORANGE ZONE</span>
    </div>
    <div class="bar">
      <div class="green"></div>
      <div class="yellow"></div>
      <div class="orange"></div>
      <div class="red"></div>
    </div>
    <input type="range" id="rsi-slider" min="0" max="100" value="50" aria-label="RSI Slider">
    <div class="ticks">
      <span>0</span><span>30</span><span>50</span><span>70</span><span>100</span>
    </div>
    <div class="card-result">
      <div>
        <small style="color:#777; font-size:10px;">CURRENT</small>
        <div id="rsi-value" class="current-value">50</div>
      </div>
      <div id="rsi-desc" class="description">Bullish momentum</div>
    </div>
  </div>

  <!-- VXN CARD -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">VXN (NASDAQ VOLATILITY)</span>
      <span id="vxn-zone" class="zone-badge">YELLOW ZONE</span>
    </div>
    <div class="bar">
      <div class="green"></div>
      <div class="yellow"></div>
      <div class="orange"></div>
      <div class="red"></div>
    </div>
    <input type="range" id="vxn-slider" min="10" max="50" value="20" aria-label="VXN Slider">
    <div class="ticks">
      <span>10</span><span>18</span><span>25</span><span>35</span><span>50</span>
    </div>
    <div class="card-result">
      <div>
        <small style="color:#777; font-size:10px;">CURRENT</small>
        <div id="vxn-value" class="current-value">20.00</div>
      </div>
      <div id="vxn-desc" class="description">Moderate Volatility</div>
    </div>
  </div>

  <!-- FEAR & GREED CARD -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">FEAR & GREED</span>
      <span id="fg-zone" class="zone-badge">ORANGE ZONE</span>
    </div>
    <div class="bar">
      <div class="red" style="width:25%;"></div>
      <div class="orange" style="width:20%;"></div>
      <div class="yellow" style="width:10%;"></div>
      <div class="green" style="width:45%;"></div>
    </div>
    <input type="range" id="fg-slider" min="0" max="100" value="55" aria-label="Fear & Greed Slider">
    <div class="ticks">
      <span>0</span><span>25</span><span>45</span><span>55</span><span>100</span>
    </div>
    <div class="card-result">
      <div>
        <small style="color:#777; font-size:10px;">CURRENT</small>
        <div id="fg-value" class="current-value">55.00</div>
      </div>
      <div id="fg-desc" class="description">Greed</div>
    </div>
  </div>

</div>

<script>
function updateRSI(val) {
  const n = Number(val);
  document.getElementById("rsi-value").textContent = n;
  let color, zone, desc;
  if (n < 30) { color = "#22c55e"; zone = "GREEN ZONE"; desc = "Oversold"; }
  else if (n < 50) { color = "#eab308"; zone = "YELLOW ZONE"; desc = "Weak momentum"; }
  else if (n < 70) { color = "#f97316"; zone = "ORANGE ZONE"; desc = "Bullish momentum"; }
  else { color = "#ef4444"; zone = "RED ZONE"; desc = "Overbought"; }
  
  document.getElementById("rsi-value").style.color = color;
  const badge = document.getElementById("rsi-zone");
  badge.style.background = color;
  badge.textContent = zone;
  document.getElementById("rsi-desc").textContent = desc;
}

function updateVXN(val) {
  const n = Number(val);
  document.getElementById("vxn-value").textContent = n.toFixed(2);
  let color, zone, desc;
  if (n < 18) { color = "#22c55e"; zone = "GREEN ZONE"; desc = "Low Volatility"; }
  else if (n < 25) { color = "#eab308"; zone = "YELLOW ZONE"; desc = "Moderate Volatility"; }
  else if (n < 35) { color = "#f97316"; zone = "ORANGE ZONE"; desc = "High Volatility"; }
  else { color = "#ef4444"; zone = "RED ZONE"; desc = "Extreme Fear / Crisis"; }
  
  document.getElementById("vxn-value").style.color = color;
  const badge = document.getElementById("vxn-zone");
  badge.style.background = color;
  badge.textContent = zone;
  document.getElementById("vxn-desc").textContent = desc;
}

function updateFG(val) {
  const n = Number(val);
  document.getElementById("fg-value").textContent = n.toFixed(2);
  let color, zone, desc;
  if (n < 25) { color = "#ef4444"; zone = "RED ZONE"; desc = "Extreme Fear"; }
  else if (n < 45) { color = "#f97316"; zone = "ORANGE ZONE"; desc = "Fear"; }
  else if (n < 55) { color = "#eab308"; zone = "YELLOW ZONE"; desc = "Neutral"; }
  else if (n < 75) { color = "#22c55e"; zone = "GREEN ZONE"; desc = "Greed"; }
  else { color = "#10b981"; zone = "BRIGHT GREEN"; desc = "Extreme Greed"; }
  
  document.getElementById("fg-value").style.color = color;
  const badge = document.getElementById("fg-zone");
  badge.style.background = color;
  badge.textContent = zone;
  document.getElementById("fg-desc").textContent = desc;
}

document.getElementById("rsi-slider").addEventListener("input", e => updateRSI(e.target.value));
document.getElementById("vxn-slider").addEventListener("input", e => updateVXN(e.target.value));
document.getElementById("fg-slider").addEventListener("input", e => updateFG(e.target.value));

async function loadMarketData() {
  try {
    const response = await fetch("./data.json?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("Data fetch failed");
    const data = await response.json();

    document.getElementById("rsi-slider").value = Math.round(data.RSI_14);
    updateRSI(data.RSI_14);

    document.getElementById("vxn-slider").value = data.VXN;
    updateVXN(data.VXN);

    document.getElementById("fg-slider").value = data.Fear_Greed;
    updateFG(data.Fear_Greed);

    document.getElementById("market-date").textContent = data.date;
  } catch (error) {
    document.getElementById("market-date").textContent = "Offline Mode";
    updateRSI(50);
    updateVXN(20);
    updateFG(55);
  }
}

loadMarketData();
</script>

</body>
</html>
