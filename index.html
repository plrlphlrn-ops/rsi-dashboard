<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI Indicator Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #111;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.rsi-card {
  background: #202020;
  color: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 600px;
  margin: 40px auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
  gap: 12px;
}

.header h3 {
  font-size: 16px;
  margin: 0;
}

#zone {
  padding: 8px 12px;
  border-radius: 20px;
  background: #f97316;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}

.bar {
  display: flex;
  height: 14px;
  border-radius: 20px;
  overflow: hidden;
}

.green { width: 30%; background: #22c55e; }
.yellow { width: 20%; background: #eab308; }
.orange { width: 20%; background: #f97316; }
.red { width: 30%; background: #ef4444; }

input[type="range"] {
  width: 100%;
  margin-top: 15px;
  accent-color: white;
  cursor: pointer;
}

.numbers {
  display: flex;
  justify-content: space-between;
  color: #aaa;
  font-size: 12px;
}

.result {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-top: 30px;
  gap: 12px;
}

#value {
  font-size: 45px;
  font-weight: bold;
  color: #f97316;
}

small {
  color: #aaa;
}

#description {
  color: #ccc;
  font-size: 13px;
  text-align: right;
}

/* Market Indicators 스타일링 */
.market-data {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #333;
  color: #aaa;
  font-size: 12px;
}

.market-data h3 {
  font-size: 13px;
  color: #fff;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.market-data p {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.market-data span {
  color: #fff;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="rsi-card">

  <div class="header">
    <h3>RSI INDICATOR</h3>
    <span id="zone">ORANGE ZONE</span>
  </div>

  <div class="bar">
    <div class="green"></div>
    <div class="yellow"></div>
    <div class="orange"></div>
    <div class="red"></div>
  </div>

  <input
    type="range"
    id="slider"
    min="0"
    max="100"
    value="50"
    aria-label="RSI value"
  >

  <div class="numbers">
    <span>0</span>
    <span>30</span>
    <span>50</span>
    <span>70</span>
    <span>100</span>
  </div>

  <div class="result">
    <div>
      <small>CURRENT RSI</small>
      <div id="value">50</div>
    </div>
    <div id="description">Bullish momentum</div>
  </div>

  <!-- 요청하신 마켓 지표 구역 추가 -->
  <div class="market-data">
    <h3>MARKET INDICATORS</h3>

    <p>NASDAQ: <span id="nasdaq">--</span></p>
    <p>VXN: <span id="vxn">--</span></p>
    <p>Fear & Greed:
      <span id="fear-greed">--</span>
    </p>
    <p>PBR: <span id="pbr">--</span></p>
    <p>Market Date:
      <span id="market-date">--</span>
    </p>
  </div>

</div>

<script>
const slider = document.getElementById("slider");
const value = document.getElementById("value");
const zone = document.getElementById("zone");
const description = document.getElementById("description");

function updateRSI() {
  const n = Number(slider.value);

  value.textContent = n;

  let color, name, desc;

  if (n < 30) {
    color = "#22c55e";
    name = "GREEN ZONE";
    desc = "Oversold";
  } else if (n < 50) {
    color = "#eab308";
    name = "YELLOW ZONE";
    desc = "Weak momentum";
  } else if (n < 70) {
    color = "#f97316";
    name = "ORANGE ZONE";
    desc = "Bullish momentum";
  } else {
    color = "#ef4444";
    name = "RED ZONE";
    desc = "Overbought";
  }

  value.style.color = color;
  zone.style.background = color;
  zone.textContent = name;
  description.textContent = desc;
}

slider.addEventListener("input", updateRSI);
updateRSI();

// Load latest market data (모든 지표 필드 반영 및 중복 제거 완료)
async function loadMarketData() {
  try {
    const response = await fetch(
      "./data.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Failed to load market data");
    }

    const data = await response.json();

    // Actual RSI
    slider.value = Math.round(data.RSI_14);
    updateRSI();

    // Update market indicators
    document.getElementById("nasdaq").textContent =
      data.NASDAQ.toLocaleString();

    document.getElementById("vxn").textContent =
      data.VXN.toFixed(2);

    document.getElementById("fear-greed").textContent =
      data.Fear_Greed.toFixed(2);

    document.getElementById("pbr").textContent =
      data.PBR.toFixed(3);

    document.getElementById("market-date").textContent =
      data.date;

  } catch (error) {
    console.error("Market data loading error:", error);
  }
}

loadMarketData();
</script>

</body>
</html>
